[package]
name = "gravity_monitor"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
nvml-wrapper = "0.12.1"

[target.'cfg(windows)'.dependencies]
winapi = "0.3"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_SystemServices"] }
